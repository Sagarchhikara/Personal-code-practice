<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="Foodapi.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-utensils"></i> Recipe Finder</h1>
                <p>Discover delicious recipes from around the world</p>
            </div>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput"
                        placeholder="Search for recipes (e.g., chicken, pasta, salad...)">
                    <button id="searchBtn" class="search-btn">
                        <span class="btn-text">Search</span>
                        <i class="fas fa-spinner fa-spin loading-icon" style="display: none;"></i>
                    </button>
                </div>

                <!-- Filters -->
                <div class="filters">
                    <div class="filter-group">
                        <label for="dietFilter">Diet:</label>
                        <select id="dietFilter">
                            <option value="">Any</option>
                            <option value="balanced">Balanced</option>
                            <option value="high-fiber">High Fiber</option>
                            <option value="high-protein">High Protein</option>
                            <option value="low-carb">Low Carb</option>
                            <option value="low-fat">Low Fat</option>
                            <option value="low-sodium">Low Sodium</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="healthFilter">Health:</label>
                        <select id="healthFilter">
                            <option value="">Any</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="vegan">Vegan</option>
                            <option value="gluten-free">Gluten Free</option>
                            <option value="dairy-free">Dairy Free</option>
                            <option value="sugar-conscious">Sugar Conscious</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="cuisineFilter">Cuisine:</label>
                        <select id="cuisineFilter">
                            <option value="">Any</option>
                            <option value="american">American</option>
                            <option value="asian">Asian</option>
                            <option value="british">British</option>
                            <option value="caribbean">Caribbean</option>
                            <option value="chinese">Chinese</option>
                            <option value="french">French</option>
                            <option value="indian">Indian</option>
                            <option value="italian">Italian</option>
                            <option value="japanese">Japanese</option>
                            <option value="mexican">Mexican</option>
                            <option value="mediterranean">Mediterranean</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="results-section">
            <div class="results-header" id="resultsHeader" style="display: none;">
                <h2 id="resultsCount"></h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">
                        <i class="fas fa-th"></i>
                    </button>
                    <button class="view-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div class="recipes-container" id="recipesContainer">
                <!-- Welcome message -->
                <div class="welcome-message">
                    <i class="fas fa-search-plus"></i>
                    <h3>Start Your Culinary Journey</h3>
                    <p>Search for your favorite ingredients or cuisine types to discover amazing recipes!</p>
                </div>
            </div>

            <!-- Load More Button -->
            <div class="load-more-container" style="display: none;">
                <button id="loadMoreBtn" class="load-more-btn">
                    <span>Load More Recipes</span>
                    <i class="fas fa-spinner fa-spin" style="display: none;"></i>
                </button>
            </div>
        </section>

        <!-- Recipe Modal -->
        <div id="recipeModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalRecipeTitle"></h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="recipe-image-container">
                        <img id="modalRecipeImage" src="" alt="">
                        <div class="recipe-badges">
                            <span class="badge time-badge">
                                <i class="fas fa-clock"></i>
                                <span id="modalRecipeTime"></span>
                            </span>
                            <span class="badge servings-badge">
                                <i class="fas fa-users"></i>
                                <span id="modalRecipeServings"></span>
                            </span>
                            <span class="badge calories-badge">
                                <i class="fas fa-fire"></i>
                                <span id="modalRecipeCalories"></span>
                            </span>
                        </div>
                    </div>

                    <div class="recipe-details">
                        <div class="recipe-section">
                            <h3><i class="fas fa-list-ul"></i> Ingredients</h3>
                            <ul id="modalRecipeIngredients"></ul>
                        </div>

                        <div class="recipe-section">
                            <h3><i class="fas fa-tags"></i> Diet Labels</h3>
                            <div id="modalRecipeLabels" class="labels-container"></div>
                        </div>

                        <div class="recipe-section">
                            <h3><i class="fas fa-heart"></i> Health Labels</h3>
                            <div id="modalRecipeHealth" class="labels-container"></div>
                        </div>

                        <div class="recipe-actions">
                            <a id="modalRecipeSource" href="#" target="_blank" class="btn-primary">
                                <i class="fas fa-external-link-alt"></i>
                                View Full Recipe
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="Foodapi.js"></script>
</body>

</html>
